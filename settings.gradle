pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = "slashlootr"

// Shared source lives in plain directories, not Gradle projects: mc-src/, compat/*, loader-*/ and
// common/ are composed into each band via srcDirs by gradle/fabric-band.gradle. Only the bands
// themselves are real projects, so there is exactly one compilation per shipped JAR.
//
// Bands B-J share mc-src. Band A (1.20.1) predates the RandomizableContainer interface and
// ResourceKey<LootTable>, so it stays a self-contained fork -- see its own build.gradle.

include "versions:1.20.1-fabric"    // Band A: MC 1.20.1        (Java 17, forked sources)
include "versions:1.20.5-fabric"    // Band B: MC 1.20.5-1.20.6
include "versions:1.21-fabric"      // Band C: MC 1.21
include "versions:1.21.1-fabric"    // Band C: MC 1.21.1        (primary / TBA target)
include "versions:1.21.2-fabric"    // Band D: MC 1.21.2-1.21.3
include "versions:1.21.4-fabric"    // Band D: MC 1.21.4-1.21.5
include "versions:1.21.6-fabric"    // Band E: MC 1.21.6-1.21.8
include "versions:1.21.9-fabric"    // Band E: MC 1.21.9-1.21.10
include "versions:1.21.11-fabric"   // Band F: MC 1.21.11

// Band G (MC 26.1.x) is a quarantined composite under versions/26.1.2/ with its own Gradle 9.4
// wrapper, Loom 1.15.5 and JDK 25. The root build shells out to it via the build26 task.
