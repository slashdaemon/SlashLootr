// Quarantined Band G build (MC 26.1.x). Runs under its own Gradle 9.4 wrapper and JDK 25 because
// Loom 1.15.5 is incompatible with the parent composite's Loom 1.13.6. The parent shells out to
// this build via its `build26` task; it is NOT included as a subproject.
//
// It still compiles the SAME shared source tree as every other band — mc-src/ plus the compat
// variants — reached by relative path since the parent's project model is not visible here.

plugins {
    id "java"
    id "net.fabricmc.fabric-loom" version "1.15.5"
}

group = project.maven_group
version = ""

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

base {
    archivesName = "${project.archives_base_name}-${project.mod_version}+mc${project.minecraft_version}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings — 26.1 ships unobfuscated.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// --- shared source composition (mirrors gradle/fabric-band.gradle) ---------------------------
// Band G variants: ids=identifier, vehicle=moved, store=codec, savedtype=id, open=containeruser.
def repoRoot = file("../..")
[
        "common/src/main/java",
        "mc-src/src/main/java",
        "compat/ids-identifier/src/main/java",
        "compat/vehicle-moved/src/main/java",
        "compat/store-codec/src/main/java",
        "compat/savedtype-id/src/main/java",
        "compat/open-containeruser/src/main/java",
        "loader-fabric/src/main/java",
].each { rel -> sourceSets.main.java.srcDirs += new File(repoRoot, rel) }
sourceSets.main.resources.srcDirs += new File(repoRoot, "loader-fabric/src/main/resources")

processResources {
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_version", project.java_version
    inputs.property "mixin_compat", project.mixin_compat

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": project.minecraft_version,
                "java_version": project.java_version
    }
    filesMatching("slashlootr.mixins.json") {
        expand "mixin_compat": project.mixin_compat
    }
}

jar {
    from("${repoRoot}/LICENSE") {
        rename { "${it}_slashlootr" }
    }
}
